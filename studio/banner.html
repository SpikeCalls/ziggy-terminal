<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/unbounded/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/600.css">
<style>
  html,body{margin:0;background:#050608}
  #b{position:relative;width:1280px;height:640px;overflow:hidden;background:#050608;font-family:'JetBrains Mono',monospace;color:#eef2f5}
  .grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:28px 28px}
  .glow1{position:absolute;left:-200px;top:-160px;width:760px;height:760px;background:radial-gradient(closest-side,rgba(20,241,149,.16),transparent)}
  .glow2{position:absolute;right:-160px;bottom:-260px;width:860px;height:860px;background:radial-gradient(closest-side,rgba(153,69,255,.22),transparent)}
  .brain{position:absolute;right:-40px;top:20px;width:760px;opacity:.16;filter:saturate(1.3) blur(.3px)}
  .fly{position:absolute;right:-70px;top:70px;width:860px;
    -webkit-mask-image:radial-gradient(60% 62% at 52% 52%,#000 58%,transparent 100%);mask-image:radial-gradient(60% 62% at 52% 52%,#000 58%,transparent 100%)}
  .txt{position:absolute;left:72px;top:96px;width:620px}
  .pre{font-size:15px;letter-spacing:.32em;color:#8d96a0;display:flex;align-items:center;gap:12px}
  .pre img{width:30px;height:30px}
  .pre b{color:#3dff9a;font-weight:600}
  .t{font-family:'Unbounded';font-weight:900;font-size:150px;line-height:.98;letter-spacing:-.03em;margin-top:22px;
    background:linear-gradient(95deg,#8affc9 0%,#3dff9a 30%,#4fd5ff 60%,#c98bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .t2{font-family:'Unbounded';font-weight:900;font-size:52px;letter-spacing:.12em;margin-top:4px;
    background:linear-gradient(90deg,#14f195,#9945ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{font-size:22px;color:#e6edf3;margin-top:26px;line-height:1.45}
  .tag em{font-style:normal;color:#3dff9a}
  .chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
  .chip{font-size:15px;font-weight:600;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);white-space:nowrap}
  .chip b{color:var(--c)}
  .term{position:absolute;right:40px;bottom:34px;font-size:15px;color:#9aa3ad;background:rgba(8,10,14,.82);border-radius:12px;padding:12px 16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 0 40px -10px rgba(20,241,149,.4);line-height:1.6}
  .g{color:#3dff9a}.p{color:#ff5ec8}.r{color:#ff4d6d}.w{color:#fff;font-weight:600}
</style></head>
<body><div id="b">
  <div class="grid"></div><div class="glow1"></div><div class="glow2"></div>
  <img class="brain" src="assets/brain.png">
  <img class="fly" src="hero/h1.png">
  <div class="txt">
    <div class="pre"><img src="assets/pump.png">SIM-01 · <b>LIVE ON PUMP.FUN</b></div>
    <div class="t">ZIGGY</div>
    <div class="t2">TERMINAL</div>
    <div class="tag">a robo fruit fly with a brain chip<br>that trades <em>memecoins</em>. still learning.</div>
    <div class="chips">
      <div class="chip" style="--c:#39d0e0"><b>166,432</b> neurons</div>
      <div class="chip" style="--c:#ff5ec8"><b>125M</b> synapses</div>
      <div class="chip" style="--c:#3dff9a"><b>1 → 4.2</b> SOL</div>
    </div>
  </div>
  <div class="term"><span class="p">[exec]</span> <span class="g">SELL</span> <span class="w">$VINEGAR</span> <span class="g">+118%</span><br><span class="p">[mem ]</span> $PEELZ looks like a rug → <span style="color:#ffd24a">SKIP</span></div>
</div></body></html>
